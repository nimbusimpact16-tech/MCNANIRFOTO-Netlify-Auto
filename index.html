<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCNAIR FOTO</title>
  <link href="style.css" rel="stylesheet" />

  <!-- Updated HERO Styles (Mobile + Center Fix) -->
  <style>
    .hero {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)),
        url("photos/2.jpg") center/cover no-repeat;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background-image 1.5s ease-in-out;
    }

    .hero-content h1 {
      font-family: "Playfair Display", serif;
      font-size: 7rem;
      color: #c9a96e;
      margin-bottom: 20px;
    }

    .hero-content p {
      font-size: 1.8rem;
      margin-bottom: 50px;
      color: white;
    }

    .btn {
      padding: 20px 60px;
      background: #c9a96e;
      color: black;
      font-weight: bold;
      font-size: 1.4rem;
      border-radius: 50px;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: white;
      transform: scale(1.05);
    }

    @media (max-width: 860px) {
      .hero {
        min-height: 85vh;
      }

      .hero-content h1 {
        font-size: 4.5rem;
      }

      .hero-content p {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <!-- Floating Mobile Menu -->
  <div class="floating-menu">
    <button class="menu-toggle">☰</button>
    <div class="menu-items">
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="showroom.html">Showroom</a>
      <a href="about.html">About</a>
      <a href="booking.html">Booking</a>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <h2 class="logo">MCNANIR FOTO</h2>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="showroom.html">Showroom</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="booking.html">Booking</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <h1>MCNANIR FOTO</h1>
      <p>Capturing moments with style, passion, and vision.</p>
      <a href="booking.html" class="btn">Book Now</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 MCNAIR FOTO. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
