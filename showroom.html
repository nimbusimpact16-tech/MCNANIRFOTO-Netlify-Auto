<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom | MCNAIRFOTO</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="logo">MCNAIRFOTO</div>
    <div class="menu-toggle" id="mobile-menu">☰</div>
    <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
        <a href="showroom.html" class="active">Showroom</a>
        <a href="booking.html">Book Now</a>
    </div>
</nav>

<section class="showroom-section">
    <h1>Showroom</h1>
    <div class="grid" id="gallery"></div>
</section>

<div class="lightbox" id="lightbox">
    <span class="close">×</span>
    <img id="lightbox-img" src="" alt="">
</div>

<script>
fetch('photos/list.json')
  .then(r => r.json())
  .then(photos => {
    const grid = document.getElementById('gallery');
    photos.forEach(src => {
      const div = document.createElement('div');
      div.className = 'img-wrapper';
      const img = document.createElement('img');
      img.src = 'photos/' + src;
      img.loading = 'lazy';
      img.onclick = () => {
        document.getElementById('lightbox-img').src = img.src;
        document.getElementById('lightbox').classList.add('active');
      };
      div.appendChild(img);
      grid.appendChild(div);
    });
  });

// Lightbox close
document.querySelector('.close').onclick = () => 
  document.getElementById('lightbox').classList.remove('active');
document.getElementById('lightbox').onclick = e => 
  if(e.target === document.getElementById('lightbox')) 
    document.getElementById('lightbox').classList.remove('active');

// Mobile menu
document.getElementById('mobile-menu').onclick = () => 
  document.getElementById('nav-links').classList.toggle('active');
</script>

</body></html>
