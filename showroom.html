<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom | MCNAIRFOTO</title><link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
</head><body>

<nav class="navbar"><div class="logo">MCNAIRFOTO</div><div class="menu-toggle" id="mobile-menu">Menu</div>
<ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
    <li><a href="pricing.html">Pricing</a></li><li><a href="showroom.html" class="active">Showroom</a></li>
    <li><a href="booking.html">Book Now</a></li>
</ul></nav>

<section class="showroom-section"><h1>Showroom</h1><div class="grid" id="gallery"></div></section>

<div class="lightbox" id="lightbox"><span class="close">×</span><img id="lightbox-img" src="" alt=""></div>

<script>
fetch('photos/list.json').then(r=>r.json()).then(photos=>{
  const grid = document.getElementById('gallery');
  photos.forEach(p=>{
    const div = document.createElement('div'); div.className='img-wrapper';
    const img = document.createElement('img');
    img.src = p.thumb; img.loading = 'lazy'; img.alt = 'MCNAIRFOTO';
    img.onclick = ()=>{ document.getElementById('lightbox-img').src = p.full; 
                        document.getElementById('lightbox').classList.add('active'); }
    div.appendChild(img); grid.appendChild(div);
  });
});
document.querySelector('.close').onclick = ()=>document.getElementById('lightbox').classList.remove('active');
document.getElementById('lightbox').onclick = e=>e.target===document.getElementById('lightbox')&&document.getElementById('lightbox').classList.remove('active');
document.getElementById('mobile-menu').onclick = ()=>document.getElementById('nav-links').classList.toggle('active');
</script>
</body></html>
