<style>
.gallery-section{padding:140px 20px 100px;background:#000;text-align:center}
.gallery-section h1{font-family:"Playfair Display",serif;font-size:4.5rem;color:#c9a96e;margin-bottom:60px}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:25px;
  max-width:1600px;
  margin:0 auto;
}
.gallery-grid img{
  width:100%;
  height:350px;
  object-fit:cover;
  border-radius:15px;
  cursor:pointer;
  transition:.4s;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}
.gallery-grid img:hover{
  transform:scale(1.03);
  box-shadow:0 20px 40px rgba(201,169,110,0.4);
}

/* LIGHTBOX MODAL */
.lightbox{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;top:0;width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  justify-content:center;align-items:center;
  padding:20px;
  box-sizing:border-box;
}
.lightbox.active{display:flex}
.lightbox img{
  max-width:95%;
  max-height:90vh;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);
}
.close{
  position:absolute;
  top:30px;right:40px;
  font-size:50px;
  color:#c9a96e;
  cursor:pointer;
  font-weight:bold;
  transition:.3s;
}
.close:hover{color:white}
@media(max-width:860px){
  .gallery-section h1{font-size:3.5rem}
  .gallery-grid{grid-template-columns:1fr}
  .gallery-grid img{height:280px}
  .close{top:20px;right:20px;font-size:40px}
}
</style>
</head>

  position: fixed;

  background: rgba(45,45,45,0.92);

  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 9998;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: all 0.35s ease;
  opacity: 0;
  pointer-events: none;
}
@media (max-width: 860px) {
  .mobile-floating-menu {opacity:1;pointer-events:auto;}
}
.mobile-floating-menu:hover {
  background:#c9a96e;
  transform:translateY(-50%) scale(1.12);
  box-shadow:0 15px 40px rgba(201,169,110,0.4);
}
.nav-links.active ~ .mobile-floating-menu,
.mobile-floating-menu.active {background:#c9a96e;}
</style>

<script>

  nav.classList.toggle('active');
  toggle?.classList.toggle('active');
  this.classList.toggle('active');
});
</script>

<script>
function openLightbox(img) {
  document.getElementById('lightbox-img').src = img.src;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = 'auto';
}
// Close on Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});
</script>
