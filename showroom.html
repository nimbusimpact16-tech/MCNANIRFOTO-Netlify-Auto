<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom | MCNAIRFOTO</title><link rel="stylesheet" href="style.css">
<style>
.showroom-section{padding:140px 20px 100px;text-align:center;background:#000}
.showroom-section h1{font-family:"Playfair Display",serif;font-size:4.5rem;color:#c9a96e;margin-bottom:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));grid-auto-rows:400px;gap:4px}
.img-wrapper{overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:.4s}
.grid img:hover{transform:scale(1.05)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.98);z-index:9999;justify-content:center;align-items:center;padding:20px}
.lightbox.active{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;border:10px solid #c9a96e;border-radius:8px}
.close{position:absolute;top:20px;right:30px;font-size:50px;color:#c9a96e;cursor:pointer}
@media(max-width:860px){.grid{grid-auto-rows:300px}}
</style>
</head>
<body>
<nav class="navbar"><div class="logo">MCNAIRFOTO</div><div class="menu-toggle" id="mobile-menu">Menu</div>
<ul class="nav-links" id="nav-links">
<li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
<li><a href="pricing.html">Pricing</a></li><li><a href="showroom.html" class="active">Showroom</a></li>
<li><a href="booking.html">Book Now</a></li></ul></nav>

<section class="showroom-section">
  <h1>Showroom</h1>
  <div class="grid"></div>
</section>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="document.getElementById('lightbox').classList.remove('active')">×</span>
  <img src="" alt="">
</div>

<script>
document.querySelector('.close').onclick = () => document.getElementById('lightbox').classList.remove('active');
document.getElementById('lightbox').onclick = e => e.target.id==='lightbox' && document.getElementById('lightbox').classList.remove('active');
document.getElementById('mobile-menu').onclick = () => document.getElementById('nav-links').classList.toggle('active');
</script>
</body></html>
