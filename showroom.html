<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom | MCNAIRFOTO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">MCNAIRFOTO</div>
  <div class="menu-toggle" id="mobile-menu">Menu</div>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="pricing.html">Pricing</a></li>
    <li><a href="showroom.html" class="active">Showroom</a></li>
    <li><a href="booking.html">Book Now</a></li>
  </ul>
</nav>

<section class="showroom-section">
  <h1>Showroom</h1>
  <div class="grid" id="gallery">
    <p style="grid-column:1/-1;color:#c9a96e;font-size:2rem;">Loading your gallery…</p>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <span class="close">×</span>
  <img src="" alt="">
</div>

<script>
fetch('photos/list.json')
  .then(r => r.json())
  .then(files => {
    const grid = document.getElementById('gallery');
    grid.innerHTML = '';
    files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'img-wrapper';
      const img = document.createElement('img');
      img.src = 'photos/' + f;
      img.loading = 'lazy';
      img.onclick = () => {
        document.querySelector('#lightbox img').src = img.src;
        document.getElementById('lightbox').classList.add('active');
      };
      div.appendChild(img);
      grid.appendChild(div);
    });
  });

// Lightbox & menu
document.querySelector('.close').onclick = () => document.getElementById('lightbox').classList.remove('active');
document.getElementById('lightbox').onclick = e => e.target.id==='lightbox' && document.getElementById('lightbox').classList.remove('active');
document.getElementById('mobile-menu').onclick = () => document.getElementById('nav-links').classList.toggle('active');
</script>

</body>
</html>
